# --- kozure/icm-metaharness fork ---
# Pin: d5833dc6512ac1adeeef91a331c29055cd8a4dbb
# Fork disposition (task 1.7): ENABLED. The keyed `draco-judged` job (and the
# schedule that fed it) was REMOVED in this fork; the offline deterministic job
# is kept. See the closing note in this file.
# Upstream: ruvnet/metaharness. Edit below this block only.
# DRACO deep-research benchmark (ADR-037).
#
# One job in this fork (upstream has two):
#   - draco-deterministic (every push + PR): runs the --no-judge DRACO subset
#     OFFLINE (mock transport, zero network, no key) and gates it against the
#     committed mock baseline with bench-baseline.mjs. This catches a
#     regression in the scorer / runner / corpus MACHINERY — not a quality
#     regression (that needs a live run). Deterministic, so it must match the
#     committed baseline-mock.json exactly modulo the 25% threshold.
#   - draco-judged (scheduled cadence only): REMOVED in this fork (task 1.7).
#     Upstream this runs a REAL judged DRACO run against OpenRouter, gated on
#     OPENROUTER_API_KEY from GCP Secret Manager. Removed here because the
#     fork holds neither the key nor the spend; see the closing note.

name: draco

on:
  push:
    branches: [main]
    paths:
      - 'packages/bench/**'
      - 'scripts/bench-baseline.mjs'
      - 'scripts/build-ordered.mjs'
      - '.github/workflows/draco.yml'
  pull_request:
    paths:
      - 'packages/bench/**'
  workflow_dispatch:
  # Scheduled judged cadence REMOVED in this fork (task 1.7): the judged job
  # spends real OpenRouter credits and sources OPENROUTER_API_KEY from
  # upstream's GCP via WIF, which is absent here. `workflow_dispatch` is kept,
  # so the judged run remains available as a deliberate manual action.

permissions:
  contents: read

jobs:
  draco-deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20' }

      - name: Install + build (root, dependency-ordered — resolves @metaharness/* workspace deps)
        shell: bash
        run: |
          npm ci || npm install
          # The ordered root build compiles kernel → hosts → bench, so
          # host-bench.ts's @metaharness/host-* imports resolve. A bench-only build
          # fails (the @metaharness scope is unpublished — workspace symlinks only
          # exist from the repo root).
          npm run build

      - name: Run the DRACO deterministic subset (offline, mock) + unit tests
        shell: bash
        run: |
          cd packages/bench
          # Run the FULL bench suite — not an explicit file list — so every
          # optimization arm (augment, self-consistency, and any future arm in
          # ADR-038) is regression-guarded the moment its test lands. An explicit
          # list silently drifts: arm tests existed but CI never ran them.
          npx vitest run
          node ./dist/draco/draco-bin.js --out=draco-current.json

      - name: Gate the machinery against the committed mock baseline
        shell: bash
        run: |
          node scripts/bench-baseline.mjs \
            --current=packages/bench/draco-current.json \
            --baseline=packages/bench/draco/runs/baseline-mock.json \
            --threshold=25
          # The mock run is deterministic — any drift here means the scorer,
          # runner, or corpus changed without re-baselining. Re-run
          # `npm run bench:draco --out=draco/runs/baseline-mock.json` and commit
          # if the change is intended.

# NOTE (task 1.7): the `draco-judged` job was REMOVED in this fork, not just
# disabled. It needs OPENROUTER_API_KEY (sourced from GCP Secret Manager via
# Workload Identity Federation) and spends real OpenRouter credits; neither
# the key nor the spend belongs in a fork. The `draco-deterministic` job above
# is self-contained and offline (mock transport, zero network, no key) and is
# kept. The judged run is documented upstream in
# packages/bench/draco/README.md and horizon.json; those references describe
# upstream's cadence, which this fork does not run.
